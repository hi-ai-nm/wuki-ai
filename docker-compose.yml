services:
  wuki-ai:
    build:
      context: .
      # 文件名是小写的 dockerfile；不写这行的话，Linux（大小写敏感）上 compose
      # 只会找 "Dockerfile"，构建直接失败（macOS 的 APFS 不区分大小写，所以以前没暴露）
      dockerfile: dockerfile
    image: wuki_ai_docker
    container_name: wuki-ai
    # 后端 / nginx 任一进程挂掉时容器会退出，交给 docker 拉起（手动 stop 不会被拉起）
    restart: unless-stopped
    ports:
      # 宿主只看见 nginx 的 8689（反向代理入口）：Flask 端（Wuki-HTML 的
      # CPP_URL=http://host.docker.internal:8689/post）完全不用改。
      # wuki-ai 自己听容器内的 127.0.0.1:9000，不再发布出来 —— 以前那种
      # 8689 直连模型的用法，现在中间多一层 nginx。
      - "8689:8689"
    volumes:
      # 只挂权重这一个文件，不挂整个 /app/Bin —— 挂目录会把镜像里的 wuki-ai 和三个 .so 盖掉。
      # 权重是运行时生成的（镜像里没有），不挂出去的话每次重建容器都要重训。
      # 注意挂载点必须是「文件」：宿主侧这个路径曾是空目录，目录挂进去后 Save
      # （ofstream 打不开目录）必然失败、Load 也读不出来 —— 表现是每次启动都从头
      # 重训、永远存不下来。现在宿主侧是空文件：首次启动训完落盘，之后启动直接
      # Load（秒级）。想强制重训把 CMD 换成 -SR 即可。
      #
      # 宿主侧路径是 Wuki-ai/Bin/model.wfm：exe 用 $ORIGIN 找同目录的 model.wfm，
      # 容器里就是 /app/Bin/model.wfm。原先写的 ./Bin/model.wfm 在宿主 repo 根并
      # 没有这个目录，docker 会默默建一个空目录 —— 正好踩上面那个坑。
      - ./Wuki-ai/Bin/model.wfm:/app/Bin/model.wfm
    healthcheck:
      # 直接探后端的 9000，TCP 连上就算就绪：curl /post 会真的跑一次推理，
      # 拿来做健康检查太贵；nginx 的 /healthz 只能证明代理层活着。
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/9000'"]
      interval: 15s
      timeout: 5s
      retries: 5
      # 首次启动没有权重时要先训练（实测 ~1m45s），这段时间不计失败
      start_period: 180s
