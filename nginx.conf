# ================= 容器里的反向代理 =================
# nginx 是容器对外的唯一入口（listen 8689），真正的 cpp-httplib 服务退到
# 容器内回环 127.0.0.1:9000（见 dockerfile 的 CMD "-S 9000" 和 docker-entrypoint.sh）。
# 宿主 / Flask 端只认 8689，所以 Wuki-HTML 的 CPP_URL 完全不用改。
#
# 这个文件在 build 时被拷到 /etc/nginx/conf.d/default.conf（见 dockerfile），
# 本机调试可以直接 nginx -c 指向别处，但别改这份的 listen / proxy_pass 端口组合。
server {
    listen 8689 default_server;
    server_name _;

    # 日志进容器的 stdout/stderr，否则 docker logs 里只有 C++ 那半边，代理层看不见
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # 提示词 + 生成结果都很小，1 MB 足够；再大直接 413，别把内存交给对面
    client_max_body_size 1m;

    # 后端还没起来（首次启动要训练一两分钟）时，nginx 已经能接连接了 ——
    # 这时给 Flask 一个明确的 JSON，而不是裸的 502 页面（前端好处理）。
    # 后端正常返回的 503 不会被这里改写（没开 proxy_intercept_errors）。
    error_page 502 503 504 = @training;

    location / {
        proxy_pass http://127.0.0.1:9000;

        # 回源走长连接：不设这两行，nginx 每个请求都给 httplib 新开一条 TCP
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 一次 POST 要等模型把 24 个 token 生成完，默认 60s 的读超时可能不够；
        # 连接超时反而要短 —— 后端没起来时快点落到 @training，别让 Flask 干等
        proxy_connect_timeout 5s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # 只证明代理层活着（真正判断后端就绪的是 compose 里对 9000 的探针，
    # 见 docker-compose.yml 的 healthcheck）
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"nginx"}';
    }

    # 502/503/504 的兜底：告诉前端「不是挂了，是在训练」
    location @training {
        default_type application/json;
        return 503 '{"status":"training","message":"模型训练中，请稍后再试"}';
    }
}
